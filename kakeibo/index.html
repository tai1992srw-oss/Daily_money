<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>家計簿</title>
<style>
  :root {
    --bg: #f4f5f7; --card: #ffffff; --text: #1c2330; --muted: #677084; --line: #e2e5eb;
    --accent: #2f5fd0; --accent-text: #ffffff; --plus: #17835a; --warn-bg: #fff4d6; --warn-text: #6b4a00;
    --danger: #c0392b; --bar: #c9d6f5;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #12151b; --card: #1c212b; --text: #e8ebf1; --muted: #98a1b3; --line: #2c3340;
      --accent: #7da2ff; --accent-text: #0e1420; --plus: #5fd0a0; --warn-bg: #3a3118; --warn-text: #f3d98a;
      --danger: #ff8a7a; --bar: #33456f;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
    font: 16px/1.5 system-ui, -apple-system, "Hiragino Sans", "Noto Sans JP", sans-serif; }
  main { max-width: 560px; margin: 0 auto; padding: 12px 16px 96px; }
  h1 { font-size: 18px; margin: 0; }
  h2 { font-size: 14px; margin: 20px 0 8px; color: var(--muted); font-weight: 600; }
  button, input, select { font: inherit; color: inherit; }
  button { cursor: pointer; border: 1px solid var(--line); background: var(--card); border-radius: 8px; padding: 8px 12px; }
  button.primary { background: var(--accent); color: var(--accent-text); border-color: var(--accent); font-weight: 600; }
  button.danger { color: var(--danger); }
  button:disabled { opacity: .5; cursor: default; }
  input, select { width: 100%; border: 1px solid var(--line); background: var(--card); border-radius: 8px; padding: 9px 10px; }
  .top { display: flex; align-items: center; justify-content: space-between; padding: 4px 0 12px; }
  .card { background: var(--card); border-radius: 12px; padding: 16px; }
  .balance-label { color: var(--muted); font-size: 13px; }
  .balance { font-size: 34px; font-weight: 700; font-variant-numeric: tabular-nums; letter-spacing: -.5px; }
  .month-row { display: flex; align-items: center; justify-content: space-between; margin-top: 14px;
    padding-top: 12px; border-top: 1px solid var(--line); }
  .month-row button { padding: 4px 12px; }
  .month-name { font-weight: 600; }
  .totals { display: flex; gap: 24px; margin-top: 10px; font-variant-numeric: tabular-nums; }
  .totals span { display: block; color: var(--muted); font-size: 12px; }
  .pending { background: var(--warn-bg); color: var(--warn-text); border-radius: 12px; padding: 12px 14px; margin-top: 12px; }
  .pending strong { display: block; margin-bottom: 6px; }
  .pending-row { display: flex; align-items: center; gap: 8px; padding: 6px 0; }
  .pending-row .what { flex: 1; min-width: 0; font-size: 14px; }
  .pending-row input { width: 110px; text-align: right; color: var(--text); }
  .tabs { display: flex; gap: 4px; margin-top: 16px; border-bottom: 1px solid var(--line); }
  .tabs button { border: 0; background: none; border-radius: 0; padding: 10px 14px; color: var(--muted);
    border-bottom: 2px solid transparent; }
  .tabs button[aria-selected="true"] { color: var(--accent); border-bottom-color: var(--accent); font-weight: 600; }
  .day { margin-top: 14px; }
  .day-head { display: flex; justify-content: space-between; color: var(--muted); font-size: 13px; padding: 0 4px 4px; }
  .entry { display: flex; align-items: center; gap: 10px; width: 100%; text-align: left; border: 0;
    border-bottom: 1px solid var(--line); border-radius: 0; background: var(--card); padding: 10px 12px; }
  .day .entry:first-of-type { border-radius: 10px 10px 0 0; }
  .day .entry:last-of-type { border-radius: 0 0 10px 10px; border-bottom: 0; }
  .day .entry:only-of-type { border-radius: 10px; }
  .entry .info { flex: 1; min-width: 0; }
  .entry .name { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .entry .meta { color: var(--muted); font-size: 12px; }
  .entry .amount { font-variant-numeric: tabular-nums; font-weight: 600; white-space: nowrap; }
  .plus { color: var(--plus); }
  .uncat { color: var(--danger); }
  .empty { color: var(--muted); text-align: center; padding: 32px 0; }
  .bar-row { margin: 10px 0; }
  .bar-head { display: flex; justify-content: space-between; font-size: 14px; font-variant-numeric: tabular-nums; }
  .bar { height: 8px; border-radius: 4px; background: var(--bar); margin-top: 4px; }
  .rule { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; padding: 10px 0; border-bottom: 1px solid var(--line); }
  .rule .wide { grid-column: 1 / -1; display: flex; gap: 6px; }
  .rule .wide input { flex: 1; }
  .row { display: flex; gap: 8px; align-items: center; margin-top: 8px; }
  .hint { color: var(--muted); font-size: 13px; margin: 6px 0; }
  .fab { position: fixed; right: max(16px, calc(50% - 264px)); bottom: 20px; width: 56px; height: 56px; border-radius: 50%;
    background: var(--accent); color: var(--accent-text); border: 0; font-size: 28px; line-height: 1;
    box-shadow: 0 4px 12px rgba(0,0,0,.25); }
  dialog { border: 0; border-radius: 14px; padding: 18px; width: min(520px, calc(100vw - 24px));
    background: var(--card); color: var(--text); }
  dialog::backdrop { background: rgba(0,0,0,.45); }
  dialog label { display: block; font-size: 13px; color: var(--muted); margin-top: 10px; }
  dialog label.check { display: flex; gap: 8px; align-items: flex-start; color: var(--text); }
  dialog label.check input { width: auto; margin-top: 4px; }
  .seg { display: flex; gap: 0; }
  .seg button { flex: 1; border-radius: 0; }
  .seg button:first-child { border-radius: 8px 0 0 8px; }
  .seg button:last-child { border-radius: 0 8px 8px 0; border-left: 0; }
  .seg button[aria-pressed="true"] { background: var(--accent); color: var(--accent-text); border-color: var(--accent); }
  .actions { display: flex; gap: 8px; margin-top: 16px; }
  .actions .spacer { flex: 1; }
  #toast { position: fixed; left: 50%; bottom: 88px; transform: translateX(-50%); background: var(--text); color: var(--bg);
    padding: 8px 14px; border-radius: 20px; font-size: 14px; opacity: 0; transition: opacity .2s; pointer-events: none;
    max-width: calc(100vw - 32px); text-align: center; }
  #toast.show { opacity: .95; }
</style>
</head>
<body>
<main>
  <div class="top">
    <h1>家計簿</h1>
    <button id="syncBtn" type="button">メールを確認</button>
  </div>

  <section class="card">
    <div class="balance-label">口座残高</div>
    <div class="balance" id="balance">—</div>
    <div class="month-row">
      <button id="prevMonth" type="button" aria-label="前の月">‹</button>
      <div class="month-name" id="monthName"></div>
      <button id="nextMonth" type="button" aria-label="次の月">›</button>
    </div>
    <div class="totals">
      <div><span>支出</span><b id="spend">—</b></div>
      <div><span>収入</span><b id="income">—</b></div>
    </div>
  </section>

  <section id="pending" class="pending" hidden></section>

  <div class="tabs" role="tablist">
    <button role="tab" data-tab="list" aria-selected="true">明細</button>
    <button role="tab" data-tab="summary" aria-selected="false">集計</button>
    <button role="tab" data-tab="rules" aria-selected="false">ルール</button>
    <button role="tab" data-tab="settings" aria-selected="false">設定</button>
  </div>
  <div id="view"><p class="empty">読み込み中…</p></div>
</main>

<button class="fab" id="addBtn" type="button" aria-label="記録を追加">+</button>

<dialog id="dlg">
  <form id="form" method="dialog">
    <div class="seg">
      <button type="button" data-type="expense" aria-pressed="true">支出</button>
      <button type="button" data-type="income" aria-pressed="false">収入</button>
    </div>
    <label>金額<input id="fAmount" inputmode="numeric" autocomplete="off" placeholder="0"></label>
    <label>日付<input id="fDate" type="date" required></label>
    <label>カテゴリ<select id="fCategory"></select></label>
    <label>店名・内容<input id="fName" autocomplete="off"></label>
    <label>支払い方法<select id="fMethod">
      <option value="口座">口座（残高に反映）</option>
      <option value="その他">現金・その他（残高に反映しない）</option>
    </select></label>
    <label>メモ<input id="fMemo" autocomplete="off"></label>
    <div id="learnBox" hidden>
      <p class="hint" id="rawStore"></p>
      <label class="check"><input id="fLearn" type="checkbox" checked>この店は今後も同じカテゴリ・店名にする</label>
    </div>
    <div class="actions">
      <button type="button" class="danger" id="delBtn">削除</button>
      <span class="spacer"></span>
      <button type="button" id="cancelBtn">やめる</button>
      <button type="submit" class="primary" id="saveBtn">保存</button>
    </div>
  </form>
</dialog>

<div id="toast" role="status"></div>

<script>
var S = null;                 // サーバーから受け取った最新の状態
var month = today().slice(0, 7);
var tab = 'list';
var editing = null;           // 編集中の記録（新規は id なし）
var $ = function (id) { return document.getElementById(id); };

function today() {
  var d = new Date();
  return d.getFullYear() + '-' + ('0' + (d.getMonth() + 1)).slice(-2) + '-' + ('0' + d.getDate()).slice(-2);
}
function esc(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
    return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
  });
}
function yen(n) {
  return (n < 0 ? '-' : '') + '¥' + Math.abs(Math.round(n)).toLocaleString('ja-JP');
}
function hasAmount(e) { return e.amount !== '' && e.amount !== null && isFinite(Number(e.amount)); }
function toast(msg) {
  var t = $('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toast.timer);
  toast.timer = setTimeout(function () { t.classList.remove('show'); }, 3500);
}

/** サーバー呼び出し。Apps Script 上では google.script.run、手元の確認用サーバーでは /api を使う。 */
function call(action, payload) {
  return new Promise(function (resolve, reject) {
    if (window.google && google.script && google.script.run) {
      google.script.run
        .withSuccessHandler(function (r) { resolve(JSON.parse(r)); })
        .withFailureHandler(reject)
        .api(action, JSON.stringify(payload || {}));
    } else {
      fetch('/api', { method: 'POST', body: JSON.stringify({ action: action, payload: payload || {} }) })
        .then(function (r) { return r.json(); })
        .then(function (r) { r.error ? reject(new Error(r.error)) : resolve(r); }, reject);
    }
  });
}
function run(action, payload, doneMsg) {
  document.body.style.cursor = 'progress';
  return call(action, payload).then(function (state) {
    S = state;
    render();
    var msg = typeof doneMsg === 'function' ? doneMsg(state) : doneMsg;
    if (msg) toast(msg);
    return state;
  }).catch(function (err) {
    toast('エラー: ' + (err && err.message ? err.message : err));
    throw err;
  }).finally(function () { document.body.style.cursor = ''; });
}

// ---------- 描画 ----------

function monthEntries() {
  return S.entries.filter(function (e) { return e.date.slice(0, 7) === month; });
}
function isSpending(e) { return S.nonSpending.indexOf(e.category) === -1; }

function render() {
  $('balance').textContent = yen(S.balance);
  $('monthName').textContent = month.slice(0, 4) + '年' + Number(month.slice(5)) + '月';
  var spend = 0, income = 0;
  monthEntries().forEach(function (e) {
    if (!hasAmount(e) || !isSpending(e)) return;
    if (e.type === 'income') income += Number(e.amount); else spend += Number(e.amount);
  });
  $('spend').textContent = yen(spend);
  $('income').textContent = yen(income);
  renderPending();
  document.querySelectorAll('.tabs button').forEach(function (b) {
    b.setAttribute('aria-selected', String(b.dataset.tab === tab));
  });
  ({ list: renderList, summary: renderSummary, rules: renderRules, settings: renderSettings })[tab]();
}

function renderPending() {
  var list = S.entries.filter(function (e) { return e.status === 'pending'; })
    .sort(function (a, b) { return a.date < b.date ? 1 : -1; });
  var box = $('pending');
  box.hidden = !list.length;
  if (!list.length) return;
  box.innerHTML = '<strong>金額の入力待ち（' + list.length + '件）</strong>' +
    '<div class="hint" style="color:inherit">銀行のメールに金額が書かれていない取引です。</div>' +
    list.map(function (e) {
      return '<div class="pending-row"><div class="what">' + esc(e.date.slice(5).replace('-', '/')) + ' ' +
        (e.type === 'income' ? '入金' : '出金') + '：' + esc(e.name) + '</div>' +
        '<input inputmode="numeric" placeholder="金額" aria-label="' + esc(e.name) + 'の金額" data-id="' + esc(e.id) + '">' +
        '<button type="button" data-save="' + esc(e.id) + '">保存</button></div>';
    }).join('');
}

function amountHtml(e) {
  if (!hasAmount(e)) return '<span class="amount uncat">未入力</span>';
  var n = Number(e.amount);
  if (e.type === 'income') return '<span class="amount plus">+' + yen(n) + '</span>';
  if (n < 0) return '<span class="amount plus">+' + yen(-n) + '</span>';
  return '<span class="amount">' + yen(n) + '</span>';
}

function renderList() {
  var list = monthEntries().sort(function (a, b) {
    return (b.date + b.time).localeCompare(a.date + a.time);
  });
  if (!list.length) {
    $('view').innerHTML = '<p class="empty">この月の記録はありません。</p>';
    return;
  }
  var days = {}, order = [];
  list.forEach(function (e) {
    if (!days[e.date]) { days[e.date] = []; order.push(e.date); }
    days[e.date].push(e);
  });
  var week = ['日', '月', '火', '水', '木', '金', '土'];
  $('view').innerHTML = order.map(function (d) {
    var total = days[d].reduce(function (s, e) {
      return s + (hasAmount(e) && e.type === 'expense' && isSpending(e) ? Number(e.amount) : 0);
    }, 0);
    var dt = new Date(d + 'T00:00:00');
    return '<div class="day"><div class="day-head"><span>' + Number(d.slice(5, 7)) + '/' + Number(d.slice(8)) +
      '（' + week[dt.getDay()] + '）</span><span>支出 ' + yen(total) + '</span></div>' +
      days[d].map(function (e) {
        var src = e.source === 'debit' ? 'デビット' : e.source === 'mail' ? '口座' : e.method === '口座' ? '手入力・口座' : '手入力・現金等';
        var cat = e.category === '未分類' ? '<span class="uncat">未分類</span>' : esc(e.category);
        return '<button type="button" class="entry" data-edit="' + esc(e.id) + '"><div class="info"><div class="name">' +
          esc(e.name) + '</div><div class="meta">' + cat + '・' + src + (e.memo ? '・' + esc(e.memo) : '') +
          '</div></div>' + amountHtml(e) + '</button>';
      }).join('') + '</div>';
  }).join('');
}

function renderSummary() {
  var sums = {}, other = 0;
  monthEntries().forEach(function (e) {
    if (!hasAmount(e) || e.type !== 'expense') return;
    if (!isSpending(e)) { other += Number(e.amount); return; }
    sums[e.category] = (sums[e.category] || 0) + Number(e.amount);
  });
  var cats = Object.keys(sums).filter(function (c) { return sums[c] !== 0; })
    .sort(function (a, b) { return sums[b] - sums[a]; });
  if (!cats.length) {
    $('view').innerHTML = '<p class="empty">この月の支出はありません。</p>';
    return;
  }
  var max = Math.max.apply(null, cats.map(function (c) { return Math.abs(sums[c]); })) || 1;
  $('view').innerHTML = '<h2>カテゴリ別の支出</h2><div class="card">' + cats.map(function (c) {
    return '<div class="bar-row"><div class="bar-head"><span' + (c === '未分類' ? ' class="uncat"' : '') + '>' + esc(c) +
      '</span><b>' + yen(sums[c]) + '</b></div><div class="bar" style="width:' +
      Math.max(2, Math.round(Math.abs(sums[c]) / max * 100)) + '%"></div></div>';
  }).join('') + '</div>' +
    (other ? '<p class="hint">このほか、振替・チャージなど集計に入れない出金が ' + yen(other) + ' あります。</p>' : '');
}

function categoryOptions(selected) {
  return S.categories.map(function (c) {
    return '<option' + (c === selected ? ' selected' : '') + '>' + esc(c) + '</option>';
  }).join('');
}

function renderRules() {
  $('view').innerHTML = '<p class="hint">メール上の店名にキーワードが含まれると、そのカテゴリと表示名で記録します。上の行が優先です。</p>' +
    '<div id="ruleList">' + S.rules.map(ruleRow).join('') + '</div>' +
    '<div class="row"><button type="button" id="addRule">行を追加</button><span style="flex:1"></span>' +
    '<button type="button" class="primary" id="saveRules">ルールを保存</button></div>';
}
function ruleRow(r) {
  return '<div class="rule"><input class="rk" placeholder="キーワード" aria-label="キーワード" value="' + esc(r.keyword) + '">' +
    '<select class="rc" aria-label="カテゴリ">' + categoryOptions(r.category) + '</select>' +
    '<div class="wide"><input class="rd" placeholder="表示名（空欄ならメールの店名のまま）" aria-label="表示名" value="' +
    esc(r.displayName) + '"><button type="button" class="danger" data-rule-del>削除</button></div></div>';
}

function renderSettings() {
  var last = S.lastSync ? new Date(S.lastSync).toLocaleString('ja-JP') : 'まだ';
  $('view').innerHTML =
    '<h2>残高を合わせる</h2><div class="card"><p class="hint">銀行アプリに出ている今の残高を入れると、差額を「残高調整」として記録します。' +
    'メールが来ない引き落としなどで残高がずれたときに使います。</p>' +
    '<div class="row"><input id="actual" inputmode="numeric" placeholder="実際の残高" aria-label="実際の残高">' +
    '<button type="button" class="primary" id="setBalance">合わせる</button></div></div>' +
    '<h2>メールの取り込み</h2><div class="card"><p class="hint">最後に確認した時刻: ' + esc(last) + '</p>' +
    '<p class="hint">デビットの利用は 15 分おきに自動で取り込まれます。過去の分をまとめて入れたいときは下のボタンを押します。</p>' +
    '<button type="button" id="backfill">過去 90 日分を取り込む</button></div>';
}

// ---------- 入力ダイアログ ----------

function openDialog(entry) {
  editing = entry;
  setType(entry.type || 'expense');
  $('fAmount').value = hasAmount(entry) ? entry.amount : '';
  $('fDate').value = entry.date || today();
  $('fCategory').innerHTML = categoryOptions(entry.category || '未分類');
  $('fName').value = entry.name || '';
  $('fMethod').value = entry.method || '口座';
  $('fMemo').value = entry.memo || '';
  $('learnBox').hidden = !entry.rawStore;
  $('rawStore').textContent = entry.rawStore ? 'メール上の店名: ' + entry.rawStore : '';
  $('fLearn').checked = true;
  $('delBtn').hidden = !entry.id;
  $('dlg').showModal();
  $('fAmount').focus();
}
function setType(type) {
  document.querySelectorAll('.seg button').forEach(function (b) {
    b.setAttribute('aria-pressed', String(b.dataset.type === type));
  });
}
function currentType() {
  return document.querySelector('.seg button[aria-pressed="true"]').dataset.type;
}

// ---------- 操作 ----------

document.querySelector('.seg').addEventListener('click', function (ev) {
  if (ev.target.dataset.type) setType(ev.target.dataset.type);
});
$('addBtn').addEventListener('click', function () { openDialog({ date: today(), source: 'manual' }); });
$('cancelBtn').addEventListener('click', function () { $('dlg').close(); });
$('form').addEventListener('submit', function (ev) {
  ev.preventDefault();
  var entry = {
    id: editing.id, type: currentType(), amount: $('fAmount').value, date: $('fDate').value,
    category: $('fCategory').value, name: $('fName').value, method: $('fMethod').value, memo: $('fMemo').value
  };
  var learn = !!editing.rawStore && $('fLearn').checked;
  run('saveEntry', { entry: entry, learn: learn }, '保存しました').then(function () { $('dlg').close(); }, function () {});
});
$('delBtn').addEventListener('click', function () {
  if (!confirm('この記録を削除しますか？')) return;
  run('deleteEntry', { id: editing.id }, '削除しました').then(function () { $('dlg').close(); }, function () {});
});

$('prevMonth').addEventListener('click', function () { shiftMonth(-1); });
$('nextMonth').addEventListener('click', function () { shiftMonth(1); });
function shiftMonth(delta) {
  var d = new Date(Number(month.slice(0, 4)), Number(month.slice(5)) - 1 + delta, 1);
  month = d.getFullYear() + '-' + ('0' + (d.getMonth() + 1)).slice(-2);
  render();
}

document.querySelector('.tabs').addEventListener('click', function (ev) {
  if (!ev.target.dataset.tab) return;
  tab = ev.target.dataset.tab;
  render();
});

function syncNow(days, quiet) {
  $('syncBtn').disabled = true;
  $('syncBtn').textContent = '確認中…';
  return run('sync', { days: days }, function (s) {
    return s.added ? s.added + ' 件を取り込みました' : (quiet ? '' : '新しい取引はありません');
  }).catch(function () {}).finally(function () {
    $('syncBtn').disabled = false;
    $('syncBtn').textContent = 'メールを確認';
  });
}
$('syncBtn').addEventListener('click', function () { syncNow(3, false); });

$('pending').addEventListener('click', function (ev) {
  var id = ev.target.dataset.save;
  if (!id) return;
  var input = $('pending').querySelector('input[data-id="' + id + '"]');
  if (!input.value.trim()) { toast('金額を入力してください'); return; }
  var e = S.entries.filter(function (x) { return x.id === id; })[0];
  run('saveEntry', { entry: { id: id, amount: input.value, date: e.date }, learn: false }, '保存しました').catch(function () {});
});

$('view').addEventListener('click', function (ev) {
  var t = ev.target.closest('button');
  if (!t) return;
  if (t.dataset.edit) {
    openDialog(S.entries.filter(function (e) { return e.id === t.dataset.edit; })[0]);
  } else if (t.id === 'addRule') {
    $('ruleList').insertAdjacentHTML('beforeend', ruleRow({ keyword: '', category: '未分類', displayName: '' }));
  } else if (t.hasAttribute('data-rule-del')) {
    t.closest('.rule').remove();
  } else if (t.id === 'saveRules') {
    var rules = Array.prototype.map.call(document.querySelectorAll('#ruleList .rule'), function (row) {
      return { keyword: row.querySelector('.rk').value, category: row.querySelector('.rc').value,
        displayName: row.querySelector('.rd').value };
    });
    run('saveRules', { rules: rules }, 'ルールを保存しました').catch(function () {});
  } else if (t.id === 'setBalance') {
    if (!$('actual').value.trim()) { toast('残高を入力してください'); return; }
    run('setBalance', { actual: $('actual').value, today: today() }, '残高を合わせました').catch(function () {});
  } else if (t.id === 'backfill') {
    syncNow(90, false);
  }
});

// 起動: まず保存済みの記録を表示し、そのあと新しいメールを確認する
run('getState').then(function () { return syncNow(3, true); }, function () {
  $('view').innerHTML = '<p class="empty">読み込めませんでした。ページを開き直してください。</p>';
});
</script>
</body>
</html>
